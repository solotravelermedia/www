---
layout: default
---
<header class="text-center">
  <div class="container">
    <h1>{{ page.title }}</h1>
    <p class="lead">{{ page.date | date: "%B %-d, %Y" }}</p>
  </div>
</header>
<section class="section section-light">
  <div class="container blog-post">
    {{ content }}
    <p class="mt-5"><a href="{{ '/blog/' | relative_url }}">&larr; Back to Blog</a></p>
  </div>
</section>
